user root;
worker_processes 1;
worker_rlimit_nofile 8192;

events {
    use epoll;
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log off;
    error_log /dev/null crit;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 300s;
    keepalive_requests 10000;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    upstream gw_split_backend {
        server unix:/dev/shm/gw-split.sock;
        keepalive 16;
    }

    upstream gw_xhttp_backend {
        server unix:/dev/shm/gw-xhttp.sock;
        keepalive 16;
    }

    server_tokens off;

    server {
        listen 8080 default_server;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"operational"}';
        }

        location /@dososdrido464-vless {
            if ($http_upgrade != "websocket") { return 302 /; }
            proxy_pass http://unix:/dev/shm/gw-stream.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /@dososdrido464-split {
            proxy_pass http://gw_split_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /@dososdrido464-xhttp {
            proxy_pass http://gw_xhttp_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /@dososdrido464-trojan {
            if ($http_upgrade != "websocket") { return 302 /; }
            proxy_pass http://unix:/dev/shm/gw-auth.sock:;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
